name: Test & Lint

run-name: Lint and run unit tests on the ${{ github.event_name }} to ${{ github.base_ref || github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint_test:
    name: Lint and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Lint the codebase
        run: npm run lint
