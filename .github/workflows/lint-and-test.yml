name: Test & Lint

run-name: Lint and run unit tests on the ${{ github.event_name }} to ${{ github.base_ref || github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint_test:
    name: Lint and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup environment
        uses: actions/setup-node@v820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Lint the codebase
        run: npm run lint
